# Measurement Spikes Scenario - Random outliers
# Tests M-estimator robustness against spurious measurements
# Simulates EMI interference, sensor glitches, or multipath effects
time:
  process_dt: 0.02
  sim_dt: 0.02
  sim_T: 300.0
  start_jd: 2459980.5
sensors:
  gyro:
    dt: 0.02
    noise:
      arw_deg: 0.15
      rrw_deg: 0.5
    scaling:
      noise_scale: 1.0
  mag:
    mag_std: 0.015
    dt: 0.2
    hard_iron: [0.0, 0.0, 0.0]
    spikes:
      enabled: true
      probability: 0.05    # 5% of measurements are outliers
      magnitude: 0.5       # Large spike magnitude (50% of unit vector)
    scaling:
      noise_scale: 8.0
  sun:
    dt: 2.0
    fov_deg: 120.0
    noise:
      sun_std: 0.027
    dropout:
      probability: 0.0
      use_measurements: true
    spikes:
      enabled: true
      probability: 0.03    # 3% outlier rate
      magnitude: 0.4
    scaling:
      noise_scale: 8.0
  star:
    dt: 5.0
    noise:
      st_std: 0.00024
    dropout:
      probability: 0.05
      use_measurements: true
      max_rate_deg_s: 5.0
    spikes:
      enabled: false  # Star tracker usually more reliable
    scaling:
      noise_scale: 8.0
process_model:
  dt: 0.02
omega_profile:
  amplitude:
    x: 0.02
    y: 0.01
    z: 0.015
  frequency:
    x: 0.01
    y: 0.008
    z: 0.005
simulation:
  run_name: meas_spikes_scenario
