# Zero-noise configuration for implementation verification
# All measurement noise set to near-zero to verify estimator correctness
# Estimators should converge to near-zero error with perfect measurements

time:
  process_dt: 0.02
  sim_dt: 0.02
  sim_T: 300.0
  start_jd: 2459980.5

sensors:
  gyro:
    dt: 0.02
    noise:
      # Near-zero gyro noise
      arw_deg: 0.0001        # Effectively zero ARW
      rrw_deg: 0.0001        # Effectively zero RRW
    scaling:
      noise_scale: 1.0
  mag:
    mag_std: 0.0001          # Near-zero magnetometer noise
    dt: 0.2
    hard_iron: [0.0, 0.0, 0.0]
    spikes:
      enabled: false
    scaling:
      noise_scale: 1.0
  sun:
    dt: 2.0
    fov_deg: 120.0
    noise:
      sun_std: 0.0001        # Near-zero sun sensor noise
    dropout:
      probability: 0.0
      use_measurements: true
    spikes:
      enabled: false
    scaling:
      noise_scale: 1.0
  star:
    dt: 5.0
    noise:
      st_std: 0.0001         # Near-zero star tracker noise
    dropout:
      probability: 0.0       # No dropouts for verification
      use_measurements: true
      max_rate_deg_s: 100.0  # Allow all measurements
    spikes:
      enabled: false
    scaling:
      noise_scale: 1.0

process_model:
  dt: 0.02

omega_profile:
  amplitude:
    x: 0.02
    y: 0.01
    z: 0.015
  frequency:
    x: 0.01
    y: 0.008
    z: 0.005

simulation:
  run_name: zero_noise_verification
