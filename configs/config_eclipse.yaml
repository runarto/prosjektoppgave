# Eclipse Scenario - No sun sensor available
# Tests estimation relying only on magnetometer and star tracker
time:
  process_dt: 0.02
  sim_dt: 0.02
  sim_T: 300.0
  start_jd: 2459980.5
sensors:
  gyro:
    dt: 0.02
    noise:
      arw_deg: 0.15
      rrw_deg: 0.5
    scaling:
      noise_scale: 1.0
  mag:
    mag_std: 0.015
    dt: 0.2
    hard_iron: [0.0, 0.0, 0.0]
    spikes:
      enabled: false
    scaling:
      noise_scale: 8.0
  sun:
    dt: 2.0
    fov_deg: 120.0
    noise:
      sun_std: 0.027
    dropout:
      probability: 1.0  # 100% dropout - eclipse condition
      use_measurements: false
    spikes:
      enabled: false
    scaling:
      noise_scale: 8.0
  star:
    dt: 5.0
    noise:
      st_std: 0.00024
    dropout:
      probability: 0.05
      use_measurements: true
      max_rate_deg_s: 5.0
    spikes:
      enabled: false
    scaling:
      noise_scale: 8.0
process_model:
  dt: 0.02
omega_profile:
  amplitude:
    x: 0.02
    y: 0.01
    z: 0.015
  frequency:
    x: 0.01
    y: 0.008
    z: 0.005
simulation:
  run_name: eclipse_scenario
