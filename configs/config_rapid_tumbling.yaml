# Rapid Tumbling Scenario - High angular rates
# Tests gyro integration accuracy and star tracker dropout at high rates
time:
  process_dt: 0.02
  sim_dt: 0.02
  sim_T: 300.0
  start_jd: 2459980.5
sensors:
  gyro:
    dt: 0.02
    noise:
      arw_deg: 0.15
      rrw_deg: 0.5
    scaling:
      noise_scale: 1.0
  mag:
    mag_std: 0.015
    dt: 0.2
    hard_iron: [0.0, 0.0, 0.0]
    spikes:
      enabled: false
    scaling:
      noise_scale: 8.0
  sun:
    dt: 2.0
    fov_deg: 120.0
    noise:
      sun_std: 0.027
    dropout:
      probability: 0.0
      use_measurements: true
    spikes:
      enabled: false
    scaling:
      noise_scale: 8.0
  star:
    dt: 5.0
    noise:
      st_std: 0.00024
    dropout:
      probability: 0.05
      use_measurements: true
      max_rate_deg_s: 3.0  # Lower threshold - drops out more at high rates
    spikes:
      enabled: false
    scaling:
      noise_scale: 8.0
process_model:
  dt: 0.02
omega_profile:
  # High angular rates - 10x baseline amplitude
  amplitude:
    x: 0.20   # ~11.5 deg/s peak
    y: 0.15   # ~8.6 deg/s peak
    z: 0.18   # ~10.3 deg/s peak
  frequency:
    x: 0.02   # Faster oscillation
    y: 0.015
    z: 0.025
simulation:
  run_name: rapid_tumbling_scenario
